{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | MindBloom Therapy</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .heading-font { font-family: 'Quicksand', sans-serif; }
    </style>
</head>

<body class="bg-gradient-to-b from-teal-50 via-white to-white text-slate-700 min-h-screen flex items-center justify-center px-6 py-12">

<div class="w-full max-w-md bg-white border border-teal-100 rounded-3xl p-8 shadow-xl shadow-teal-100/50">

    <h1 class="heading-font text-4xl font-bold text-center text-slate-800 mb-3">
        Welcome Back
    </h1>

    <p class="text-center text-slate-500 mb-8">
        Login to manage your sessions.
    </p>

    {% if form.non_field_errors %}
    <div class="bg-rose-50 border border-rose-200 text-rose-700 p-4 rounded-xl mb-6 text-sm">
        {% for error in form.non_field_errors %}
        <p>{{ error }}</p>
        {% endfor %}
    </div>
    {% endif %}

    <form method="POST" class="space-y-5">
        {% csrf_token %}

        <div>
            <label class="block mb-2 text-slate-600 text-sm font-medium" for="id_username">Username</label>
            <input
                type="text"
                name="username"
                id="id_username"
                required
                autofocus
                class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:border-teal-400">
        </div>

        <div>
            <label class="block mb-2 text-slate-600 text-sm font-medium" for="id_password">Password</label>
            <input
                type="password"
                name="password"
                id="id_password"
                required
                class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:border-teal-400">
        </div>

        <button
            type="submit"
            class="w-full bg-teal-500 text-white py-3 rounded-xl font-bold hover:bg-teal-600 transition duration-300 shadow-lg shadow-teal-200">
            Login
        </button>
    </form>

    <div class="mt-6 text-center text-slate-500">
        Don't have an account?
        <a href="{% url 'signup' %}" class="text-teal-600 font-semibold hover:underline">
            Create one
        </a>
    </div>

    <div class="mt-4 text-center">
        <a href="{% url 'home' %}" class="text-sm text-slate-400 hover:text-teal-600">
            ← Back to Home
        </a>
    </div>

</div>

</body>
</html>
