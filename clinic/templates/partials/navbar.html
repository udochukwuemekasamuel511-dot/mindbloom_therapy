{% load static %}
<nav class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-teal-100 px-6 md:px-12 py-4 shadow-sm">
    <div class="max-w-7xl mx-auto flex justify-between items-center">

        <a href="{% url 'home' %}" class="flex items-center gap-2">
            <span class="heading-font text-2xl md:text-3xl font-bold text-teal-600">MindBloom</span>
            <span class="text-xs md:text-sm text-orange-400 font-semibold tracking-widest uppercase mt-1">Therapy</span>
        </a>

        <!-- DESKTOP NAV -->
        <div class="hidden md:flex gap-8 items-center text-slate-600 font-medium">
            <a href="{% url 'home' %}" class="hover:text-teal-600 transition {% if request.resolver_match.url_name == 'home' %}text-teal-600{% endif %}">Home</a>
            <a href="{% url 'catalog' %}" class="hover:text-teal-600 transition {% if request.resolver_match.url_name == 'catalog' %}text-teal-600{% endif %}">Services</a>

            {% if user.is_authenticated %}
                <a href="{% url 'dashboard' %}" class="hover:text-teal-600 transition {% if request.resolver_match.url_name == 'dashboard' %}text-teal-600{% endif %}">My Sessions</a>
                <a href="{% url 'logout' %}" class="text-slate-400 hover:text-rose-500 transition">Logout</a>
            {% else %}
                <a href="{% url 'login' %}" class="hover:text-teal-600 transition">Login</a>
                <a href="{% url 'signup' %}" class="hover:text-teal-600 transition">Sign Up</a>
            {% endif %}

            <a href="{% url 'catalog' %}"
               class="bg-teal-500 px-5 py-2.5 rounded-full text-white font-semibold hover:bg-teal-600 transition shadow-sm shadow-teal-200">
                Book a Session
            </a>
        </div>

        <!-- MOBILE MENU BUTTON -->
        <button id="navToggle" type="button" aria-label="Toggle menu" aria-expanded="false"
                class="md:hidden text-teal-600 p-2 -mr-2">
            <svg id="navIconOpen" xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
            <svg id="navIconClose" xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>
    </div>

    <!-- MOBILE NAV PANEL -->
    <div id="navMenu" class="hidden md:hidden max-w-7xl mx-auto mt-5 pb-2 flex flex-col gap-4 text-slate-600 font-medium">
        <a href="{% url 'home' %}" class="hover:text-teal-600 transition py-1">Home</a>
        <a href="{% url 'catalog' %}" class="hover:text-teal-600 transition py-1">Services</a>

        {% if user.is_authenticated %}
            <a href="{% url 'dashboard' %}" class="hover:text-teal-600 transition py-1">My Sessions</a>
            <a href="{% url 'logout' %}" class="text-slate-400 hover:text-rose-500 transition py-1">Logout</a>
        {% else %}
            <a href="{% url 'login' %}" class="hover:text-teal-600 transition py-1">Login</a>
            <a href="{% url 'signup' %}" class="hover:text-teal-600 transition py-1">Sign Up</a>
        {% endif %}

        <a href="{% url 'catalog' %}"
           class="bg-teal-500 px-5 py-3 rounded-full text-white font-semibold hover:bg-teal-600 transition text-center">
            Book a Session
        </a>
    </div>
</nav>

<script>
(function () {
    const toggle = document.getElementById('navToggle');
    const menu = document.getElementById('navMenu');
    const iconOpen = document.getElementById('navIconOpen');
    const iconClose = document.getElementById('navIconClose');

    if (!toggle || !menu) return;

    toggle.addEventListener('click', function () {
        const isHidden = menu.classList.contains('hidden');
        menu.classList.toggle('hidden');
        iconOpen.classList.toggle('hidden');
        iconClose.classList.toggle('hidden');
        toggle.setAttribute('aria-expanded', isHidden ? 'true' : 'false');
    });
})();
</script>
