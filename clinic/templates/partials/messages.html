{% if messages %}
<div class="max-w-7xl mx-auto px-6 pt-6 space-y-3">
    {% for message in messages %}
    <div class="rounded-xl px-5 py-3 text-sm font-medium border
                {% if message.tags == 'success' %}bg-emerald-50 text-emerald-700 border-emerald-200
                {% elif message.tags == 'error' %}bg-rose-50 text-rose-700 border-rose-200
                {% else %}bg-amber-50 text-amber-700 border-amber-200{% endif %}">
        {{ message }}
    </div>
    {% endfor %}
</div>
{% endif %}
