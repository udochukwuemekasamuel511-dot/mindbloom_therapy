{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Booked | MindBloom Therapy</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }
        .heading-font { font-family: 'Quicksand', sans-serif; }
    </style>
</head>

<body class="bg-gradient-to-b from-teal-50 via-white to-white text-slate-700 min-h-screen flex flex-col">

{% include 'partials/navbar.html' %}

<div class="flex-1 flex items-center justify-center px-6 py-16">
    <div class="text-center">

        <div class="w-24 h-24 mx-auto mb-6">
            <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="32" cy="32" r="30" fill="#CCFBF1"/>
                <path d="M20 33l8 8 16-18" stroke="#0D9488" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>

        <h1 class="heading-font text-4xl sm:text-5xl font-bold text-slate-800 mb-4">
            You're All Set
        </h1>

        <p class="text-slate-500 text-lg mb-8 max-w-md mx-auto">
            Your session request has been received. We'll confirm it shortly —
            you can track its status anytime from your dashboard.
        </p>

        <div class="flex flex-col sm:flex-row gap-4 justify-center">
            <a href="{% url 'dashboard' %}"
               class="bg-teal-500 text-white px-8 py-4 rounded-2xl font-semibold hover:bg-teal-600 transition shadow-lg shadow-teal-200">
                View My Sessions
            </a>
            <a href="{% url 'home' %}"
               class="border-2 border-teal-200 text-teal-600 px-8 py-4 rounded-2xl font-semibold hover:bg-teal-50 transition">
                Back Home
            </a>
        </div>

    </div>
</div>

{% include 'partials/footer.html' %}

</body>
</html>
